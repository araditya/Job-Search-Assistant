version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: job_search_db
    environment:
      POSTGRES_USER: ${DB_USER:-job_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secure_password}
      POSTGRES_DB: ${DB_NAME:-job_search_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-job_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Flask API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: job_search_backend
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${DB_USER:-job_user}:${DB_PASSWORD:-secure_password}@postgres:5432/${DB_NAME:-job_search_db}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-in-production}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: python app.py

  # Frontend React App
  frontend:
    build:
      context: ./job-search-app/frontend
      dockerfile: Dockerfile
    container_name: job_search_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000

volumes:
  postgres_data:
